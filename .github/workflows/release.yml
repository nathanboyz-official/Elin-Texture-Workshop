# Builds the downloadable zip whenever a version tag is pushed, and attaches it to a
# GitHub Release. Push a tag like v1.0.0 and the release appears with the zip on it.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:        # so a build can also be started by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run the tests
        run: dotnet test -c Release --nologo

      # Self-contained, so someone downloading this does not have to install .NET first.
      - name: Publish
        run: >
          dotnet publish src/ElinTextureManager.App
          -c Release -r win-x64 --self-contained true
          -o publish/win-x64 --nologo

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = 'dev' }
          $name = "ElinTextureWorkshop-$tag-win-x64"
          Compress-Archive -Path publish/win-x64/* -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ElinTextureWorkshop-win-x64
          path: ${{ env.ASSET }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ## Install

            1. Download **${{ env.ASSET }}** below.
            2. Right-click the zip, choose **Properties**, tick **Unblock**, then extract it.
            3. Run **ElinTextureWorkshop.exe**.
            4. Optional: double-click **Create Desktop Shortcut.cmd** for a desktop icon.

            No installer and no .NET needed - everything is inside the zip.

            Windows will show a blue "Windows protected your PC" box the first time,
            because this build is not code-signed. Choose **More info** then
            **Run anyway**. A signing certificate costs money every year; the source
            is here if you would rather build it yourself.
